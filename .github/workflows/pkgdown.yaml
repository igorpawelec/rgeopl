# Builds the pkgdown site and publishes it to the gh-pages branch.
#
# Two departures from the stock template, both deliberate:
#
#   `_pkgdown.yml` sets `destination: site`, because `docs/` in this repository
#   already holds the GitHub-readable markdown copies of the vignettes. So the
#   deploy step publishes `site`, not `docs` -- publishing `docs` would put raw
#   markdown on the website and bury the site.
#
#   Nothing here needs network access to the Polish services: the vignettes are
#   precompiled, so pkgdown only lays out results that are already in the repo.

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    permissions:
      contents: write

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: site
